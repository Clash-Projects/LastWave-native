name: Feature Request
description: Suggest a new feature or improvement for LastWave
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting improvements to LastWave.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: What problem does this feature solve, or what is missing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work in the app?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Have you considered any alternative workflows or workarounds?
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Mockups, screenshots, or references to similar implementations.
