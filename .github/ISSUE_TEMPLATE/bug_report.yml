name: Bug Report
description: Report an issue or unexpected behavior in LastWave
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting a new report to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: App Version
      description: The exact version of LastWave you are using (e.g. 3.4.0).
      placeholder: "3.4.0"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android Version & Device
      description: Device manufacturer, model, and Android OS version.
      placeholder: "Pixel 8 Pro, Android 15"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Attach logcat output or screenshots if applicable.
      render: shell
