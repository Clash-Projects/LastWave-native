name: Build LastWave APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build APKs
        env:
          QOBUZ_API_KEY: ${{ secrets.QOBUZ_API_KEY }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Sign Release APK
        if: ${{ env.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Signed Release APK
        if: ${{ env.SIGNING_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Signed-Release-APK
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Upload Unsigned Release APK (Fallback)
        if: ${{ env.SIGNING_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Release-APK
          path: app/build/outputs/apk/release/*.apk
